# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/nilog-dotnet-logging"
title: "Nilog"
description: "Low-allocation typed ILogger extensions for structured logging in .NET, with Roslyn analyzers, Native AOT support and performance documentation."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "CHANGELOG.md"
    values:
      title: "Nilog Changelog and Release Notes"
      description: "Review Nilog release history, including ILogger extension updates, analyzer improvements, fixes and compatibility changes."
  - scope:
      path: "Nilog/README.nuget.md"
    values:
      title: "Nilog — Typed ILogger Extensions from NuGet"
      description: "Install Nilog for typed structured logging through Microsoft.Extensions.Logging, with Roslyn analyzers, configuration examples and allocation caveats."
  - scope:
      path: "README.md"
    values:
      title: "Nilog — Typed Structured Logging for .NET"
      description: "Use Nilog's typed ILogger extensions for low-allocation structured logging in .NET. Explore Roslyn analyzers, provider compatibility and benchmark limits."
  - scope:
      path: "SECURITY.md"
    values:
      title: "Nilog Security Policy and Vulnerability Reporting"
      description: "Find Nilog vulnerability reporting instructions, supported version guidance and the information to include in a private security report."

# Public documentation navigation and presentation.
repository: gcfernando/nilog-dotnet-logging
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Libraries & packages"
