# -----------------------------------------------------------------------------
#  Continuous integration for Nilog.
#
#  Runs on every push to main and on every pull request: restores, builds the
#  library in Release (which enforces TreatWarningsAsErrors), and runs the full
#  xUnit suite across net8.0 / net9.0 / net10.0. This is the gate that keeps main
#  green; the Release workflow re-runs the same tests before publishing.
#
#  Nilog is cross-platform, so CI runs on Linux.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run for the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SetupDotnetSdks
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore Nilog/Nilog.sln --locked-mode

      # Release build of the library enforces TreatWarningsAsErrors + analyzers.
      - name: BuildLibrary
        run: >
          dotnet build Nilog/Nilog.Core/Nilog.Core.csproj
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test Nilog/Nilog.Tests/Nilog.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: TestAnalyzers
        run: >
          dotnet test Nilog/Nilog.Analyzers.Tests/Nilog.Analyzers.Tests.csproj
          --configuration Release
          --verbosity normal
